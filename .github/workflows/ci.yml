name: CI

on:
    push:
      branches: [main]
    pull_request:
      branches: [main]
 
jobs:
    typecheck-and-build:
      name: Type-check & build
      runs-on: ubuntu-latest
      services:
        postgres:
          image: postgres:17-alpine
          env:
            POSTGRES_PASSWORD: security-test-only
          ports:
            - 5432:5432
          options: >-
            --health-cmd pg_isready
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm

        - name: Install dependencies
          run: npm ci

        - name: Security regression tests
          run: npm run test:security

        - name: Database security regression tests
          env:
            PGPASSWORD: security-test-only
          run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/security-db-cloture.sql

        - name: Concurrent database closure tests
          env:
            PGPASSWORD: security-test-only
          run: bash tests/security-db-concurrency.sh psql -h 127.0.0.1 -U postgres -d postgres

        - name: Atomic response synchronization tests
          env:
            PGPASSWORD: security-test-only
          run: |
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/security-db-sync.sql
            bash tests/security-db-sync-concurrency.sh psql -h 127.0.0.1 -U postgres -d postgres

        - name: Offline origin and requested cleanup tests
          env:
            PGPASSWORD: security-test-only
          run: |
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/security-db-origin.sql
            bash tests/security-db-maintenance.sh psql -h 127.0.0.1 -U postgres -d postgres

        - name: Type-check
          run: npx tsc --noEmit

        - name: Build (with dummy env vars)
          env:
            NEXT_PUBLIC_SUPABASE_URL: https://ci.dummy.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_dummy_anon_key
            NEXT_PUBLIC_APP_URL: https://ci.dummy
          run: npm run build
