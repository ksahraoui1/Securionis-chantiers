services:                                                                                                             
    app:                                                    
      build: .
      ports:
        # Bind local uniquement — Nginx proxifie vers localhost:3000.
        # Empêche l'accès direct au port depuis Internet (contournement Cloudflare).
        - "127.0.0.1:3000:3000"
      env_file:                                                                                                         
        - .env
      restart: unless-stopped 
